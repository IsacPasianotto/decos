apiVersion: apps/v1
kind: Deployment
metadata:
  name: decos-webapp
  namespace: decos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: decos-webapp
  template:
    metadata:
      labels:
        app: decos-webapp
    spec:
      containers:
        - name: decos-webapp
          image: docker.io/your-user/decos_webapp:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 5678
              name: debug
          command:
            - sh
            - -c
            - >
              pip install debugpy -t /tmp &&
              python3 /tmp/debugpy --wait-for-client --listen 0.0.0.0:5678 decos/decos_webapp/manage.py runserver 0.0.0.0:8080
          envFrom:
            - configMapRef:
                name: wagtail-cm
            - secretRef:
                name: decos-key-sec
