apiVersion: apps/v1
kind: Deployment
metadata:
  name: decos-webapp
  namespace: decos
spec:
  template:
    spec:
      containers:
        - name: decos-webapp
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 5678
              name: debug
          command:
            - sh
            - -c
            - >
              pip install debugpy -t /tmp &&
              cat /ca.pem >> $(python3 -m certifi) &&
              python3 /tmp/debugpy --wait-for-client --listen 0.0.0.0:5678 decos/decos_webapp/manage.py runserver 0.0.0.0:8080
          volumeMounts:
            - name: ca-cert
              mountPath: /ca.pem
              subPath: ca.pem
      volumes:
        - name: ca-cert
          secret:
            secretName: decos-cert-minio-sec
